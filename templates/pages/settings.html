{% extends "base.html" %}
{% block title %}Настройки — AI Visibility Optimizer{% endblock %}
{% block content %}
<div class="nav">
    <a href="/dashboard" class="nav-brand"><span>AI</span> Visibility</a>
    <div class="nav-links">
        <a href="/dashboard" class="nav-link">Дашборд</a>
        <a href="/dashboard/settings" class="nav-link active">Настройки</a>
        <a href="/logout" class="nav-link btn-danger">Выйти</a>
    </div>
</div>

<div class="card" style="max-width:500px;margin:40px auto;">
    <h2>Настройки</h2>
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Yandex API Key</label>
            <input type="text" name="yandex_api_key" class="form-input" value="{{ user.yandex_api_key_encrypted or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label">Yandex Folder ID</label>
            <input type="text" name="yandex_folder_id" class="form-input" value="{{ user.yandex_folder_id_encrypted or '' }}">
        </div>
        <button type="submit" class="btn btn-primary w-full">Сохранить</button>
    </form>
    <div class="mt-3" style="border-top:1px solid var(--border);padding-top:16px;">
        <p class="text-muted text-sm">Тариф: <strong>{{ user.tariff or 'trial' }}</strong></p>
        <p class="text-muted text-sm">Подписка: {{ 'Активна' if user.subscription_active else 'Неактивна' }}</p>
    </div>
</div>
{% endblock %}
