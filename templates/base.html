<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>{% block title %}AI Visibility Optimizer{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{--bg:#03001a;--surface:rgba(10,8,30,0.7);--border:rgba(120,100,255,0.12);--border-active:rgba(140,120,255,0.4);--accent:#7c3aed;--neon:#c084fc;--text:#e8e4f0;--text-bright:#fff;--text-muted:#8a8aaa;--success:#34d399;--danger:#f87171;--gradient-btn:linear-gradient(135deg,#7c3aed 0%,#6366f1 100%);--font-mono:'JetBrains Mono',monospace;--font-sans:'Inter',sans-serif;--radius:6px;--radius-sm:4px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--font-sans);background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}.content{max-width:1100px;margin:0 auto;padding:16px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--radius-sm);font-weight:700;font-size:.8rem;font-family:var(--font-mono);text-transform:uppercase;cursor:pointer;border:1px solid transparent;text-decoration:none}.btn-primary{background:var(--gradient-btn);color:var(--text-bright)}.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted)}.form-input{width:100%;padding:10px 12px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-bright);font-family:var(--font-mono);outline:none}.alert{padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:12px;font-size:.8rem;border-left:3px solid}.alert-success{background:rgba(52,211,153,.08);border-color:var(--success);color:var(--success)}.alert-error{background:rgba(248,113,113,.08);border-color:var(--danger);color:var(--danger)}h1{font-family:var(--font-mono);font-size:1.5rem;font-weight:800;text-transform:uppercase}.text-muted{color:var(--text-muted)}.text-center{text-align:center}.mt-1{margin-top:6px}.mt-2{margin-top:12px}.mb-2{margin-bottom:12px}.flex{display:flex;gap:8px;align-items:center}.flex-center{justify-content:center}.flex-wrap{flex-wrap:wrap}.w-full{width:100%}</style></head><body><div class="content">{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
